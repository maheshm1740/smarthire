global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot services (actuator/prometheus endpoint)
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'job-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: 'candidate-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']

  # FastAPI services (/metrics endpoint)
  - job_name: 'resume-parser'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8090']

  - job_name: 'ranking-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8091']

  - job_name: 'interview-scheduler'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8092']

  - job_name: 'jd-generator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8093']
